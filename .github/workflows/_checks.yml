name: Checks (reusable)

# lint + тесты CI-скриптов + security. Общий блок для PR и main, чтобы не дублировать в двух файлах.
on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.14.0
      - name: Lint + format check
        run: |
          ruff check .
          ruff format --check .
      - name: KB lint (онтология базы знаний)
        run: |
          if [ -d docs/gitmark ]; then
            python .claude/skills/kb-search/gitmark.py lint --strict
          else
            echo "::notice::нет docs/gitmark — KB lint пропущен"
          fi

  scripts:
    # Тесты CI-скриптов (.github/scripts/tests/*.test.sh): временный git-репо и шимы вместо
    # ssh/docker — ни сети, ни реестра, секунды. Гоняется весь каталог: новый тест подхватится сам.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: CI script tests
        run: |
          shopt -s nullglob
          found=0
          for t in .github/scripts/tests/*.test.sh; do
            echo "::group::$t"; bash "$t"; echo "::endgroup::"
            found=1
          done
          [ "$found" = 1 ] || { echo "::error::в .github/scripts/tests/ нет ни одного теста"; exit 1; }

  security:
    if: "!contains(github.event.head_commit.message, '[skip security]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan (рабочее дерево, не история)
        # filesystem-скан текущего состояния репо, а не всей git-истории:
        # быстрее и по делу. Образ пинуем по неизменяемому digest (тег в комментарии).
        run: |
          docker run --rm -v "$PWD:/repo" \
            trufflesecurity/trufflehog@sha256:96f8429082cb2d4ae73b1096dcdb2f5aa139881d97042b0c5e5fa226a392e056 \
            filesystem /repo --only-verified --fail  # v3.95.6

      - name: SAST
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d  # v1
        with:
          config: p/owasp-top-10

      - name: Deps audit
        run: |
          pip install pip-audit
          if grep -q '^\[project\]' pyproject.toml; then
            pip-audit .                      # читает зависимости из pyproject [project]
          else
            echo "::notice::в pyproject нет [project].dependencies — аудит пропущен"
          fi
