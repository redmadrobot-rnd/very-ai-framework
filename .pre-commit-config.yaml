repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # .gitattributes держит LF в репозитории, этот хук — в рабочей копии: иначе
  # CRLF всплывает уже на хосте (`set -euo pipefail\r` роняет install.sh).
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--disable-plugin", "KeywordDetector"]

  - repo: local
    hooks:
      - id: gitmark-lint
        name: KB lint
        entry: python .claude/skills/kb-search/gitmark.py lint --strict
        language: system
        pass_filenames: false
        files: \.md$
