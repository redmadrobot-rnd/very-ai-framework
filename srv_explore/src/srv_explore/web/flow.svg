<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 296" width="880" height="296" role="img"
     aria-label="Схема: сервис живёт в systemd на удалённом сервере и слушает только loopback; и админ, и инженер приходят через SSH-туннель с токеном — админ в Admin UI, где выдаёт доступы и включает ресурсы, инженер в MCP-сервер, который под каждый прогон спавнит агента в песочнице без прав с read-only файловой системой; агент делает только безопасные операции над файлами, логами, docker и БД и возвращает факты. Сервис ставит и обновляет деплой-воркфлоу GitHub Actions.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect fill="#161b22" stroke="#30363d" x="4" y="8" width="150" height="44" rx="9"/>
